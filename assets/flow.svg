<svg width="860" height="330" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">How dsh-plugin-health-check works</title>
  <desc id="d">A profile selects bundles; bundle patches, the profile patch, the home patch and invocation overlays are composed with the official Cordis algorithm; the resulting entries are scanned statically and produce findings. A candidate package can replace a bundle by identity. Runtime behaviour is not inspected.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.6" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#27264f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="16" fill="url(#bg)"/>

  <!-- candidate -->
  <rect x="196" y="20" width="372" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.7"/>
  <text x="213" y="38" font-family="Consolas, Menlo, monospace" font-size="12" fill="#7dd3fc">--candidate  swap by identity, diff vs baseline</text>
  <path d="M268 48 V68" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowc)"/>

  <!-- stage boxes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect x="32" y="72" width="140" height="104" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="48" y="100" font-size="15" font-weight="700" fill="#f8fafc">profile</text>
      <text x="48" y="124" font-size="11.5" fill="#94a3b8" font-family="Consolas, Menlo, monospace">dsh.profile</text>
      <text x="48" y="141" font-size="11.5" fill="#94a3b8" font-family="Consolas, Menlo, monospace">.bundles</text>
      <text x="48" y="162" font-size="11.5" fill="#64748b">web · desktop</text>
    </g>
    <g>
      <rect x="196" y="72" width="140" height="104" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="212" y="100" font-size="15" font-weight="700" fill="#f8fafc">bundle</text>
      <text x="212" y="124" font-size="11.5" fill="#94a3b8" font-family="Consolas, Menlo, monospace">dsh.bundle.patch</text>
      <text x="212" y="141" font-size="11.5" fill="#94a3b8" font-family="Consolas, Menlo, monospace">engines.dsh</text>
      <text x="212" y="162" font-size="11.5" fill="#64748b">resolve · admit</text>
    </g>
    <g>
      <rect x="360" y="72" width="140" height="104" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="376" y="100" font-size="15" font-weight="700" fill="#f8fafc">patch</text>
      <text x="376" y="124" font-size="11.5" fill="#94a3b8">bundle → profile</text>
      <text x="376" y="141" font-size="11.5" fill="#94a3b8">→ home → --patch</text>
      <text x="376" y="162" font-size="11.5" fill="#64748b">official Cordis</text>
    </g>
    <g>
      <rect x="524" y="72" width="140" height="104" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="540" y="100" font-size="15" font-weight="700" fill="#f8fafc">entries</text>
      <text x="540" y="124" font-size="11.5" fill="#94a3b8">groups · includes</text>
      <text x="540" y="141" font-size="11.5" fill="#94a3b8">disabled · MCP</text>
      <text x="540" y="162" font-size="11.5" fill="#64748b">static scan</text>
    </g>
    <g>
      <rect x="688" y="72" width="140" height="104" rx="12" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="704" y="100" font-size="15" font-weight="700" fill="#6ee7b7">findings</text>
      <text x="704" y="124" font-size="11.5" fill="#a7f3d0" font-family="Consolas, Menlo, monospace">R1  R8</text>
      <text x="704" y="141" font-size="11.5" fill="#a7f3d0" font-family="Consolas, Menlo, monospace">DSH_*</text>
      <text x="704" y="162" font-size="11.5" fill="#6ee7b7">+ coverage</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M172 124 H194" marker-end="url(#arrow)"/>
    <path d="M336 124 H358" marker-end="url(#arrow)"/>
    <path d="M500 124 H522" marker-end="url(#arrow)"/>
    <path d="M664 124 H686" marker-end="url(#arrow)"/>
  </g>

  <!-- boundary -->
  <rect x="32" y="214" width="796" height="94" rx="12" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.55" stroke-dasharray="6 4"/>
  <text x="52" y="240" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">NOT INSPECTED — STATIC ONLY</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">
    <text x="52" y="266">runtime tools · commands · hooks</text>
    <text x="272" y="266">Agent preset activation</text>
    <text x="444" y="266">MCP connection · tools/list</text>
    <text x="644" y="266">effective session permissions</text>
  </g>
  <text x="52" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">A pass never claims these. Empty, dynamic or unresolved input is reported as INCOMPLETE, not as healthy.</text>
</svg>
